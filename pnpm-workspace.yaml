packages:
  - "apps/*"
  - "packages/*"
  - "jobs"

# Dependencias autorizadas a ejecutar scripts de instalación (pnpm las bloquea por defecto).
allowBuilds:
  # Deja instalado su binario nativo; lo usa drizzle-kit.
  esbuild: true
  # Su script solo copia el service worker para el navegador; en los tests de Node no hace falta.
  msw: false
