name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

# Si se sube otra vez a la misma rama, se cancela la ejecución anterior
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  comprobar:
    name: Lint, typecheck y tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      ASTRO_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v7

      # Instala la versión de pnpm fijada en package.json (packageManager)
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Lint y formato
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: pnpm test
