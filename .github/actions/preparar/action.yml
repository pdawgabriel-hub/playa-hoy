name: Preparar
description: Instala pnpm, Node (la versión de .nvmrc) y las dependencias del monorepo

runs:
  using: composite
  steps:
    # Instala la versión de pnpm fijada en package.json (packageManager)
    - uses: pnpm/action-setup@v6

    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - name: Instalar dependencias
      shell: bash
      run: pnpm install --frozen-lockfile
